
[language-server.angular]
command = "ngserver"
args = [
  "--stdio",
  "--tsProbeLocations",
  "/home/noble/.local/lib/node_modules",
  "--ngProbeLocations",
  "/home/noble/.local/lib/node_modules",
]
luau = { command = "luau-lsp", args = ["lsp","--definitions:@noctalia=/home/noble/Projects/noctalia-plugins/noctalia.d.luau"] }
[language-server.zls]
config.enable_argument_placeholders=false


[language-server]
yuckls = {command="yuckls"}
# ols = {command = "/home/noble/Documents/ols/ols"}
avalonials = {command="avalonia-ls"}
omnisharp={"command"="omnisharp" , timeout=200000}
qmlls={"command"="/usr/lib/qt6/bin/qmlls", timeout=20000}
roslyn-language-server = { command = "roslyn-language-server", args = ["--stdio", "--autoLoadProjects"] }

[[language]]
name="yuck"
scope="source.yuck"
injection-regex="yuck"
file-types=["yuck"]
language-servers = ["yuckls"]

[[language]]
name="xml"
scope="source.axaml"
injection-regex="axaml"
file-types=["axaml"]
language-servers=["avalonials"]
grammar="xml"
auto-format=false
formatter={command="xaml-styler",args=["--write-to-stdout" ,"--take-pipe"]}

[[language]]
name = "c-sharp"
scope = "source.csharp"
injection-regex = "c-?sharp"
file-types = ["cs", "csx", "cake"]
roots = ["*.slnx", "*.sln", "*.csproj"]
comment-tokens = ["//", "///"]
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "\t" }
language-servers = [ "roslyn-language-server"]


[[language]]
name = "odin"
auto-format = false
scope = "source.odin"
file-types = ["odin"]
roots = ["ols.json", "main.odin"]
language-servers = [ "ols" ]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "\t" }
formatter = { command = "odinfmt", args = [ "-stdin" ] }


[[language]]
name = "nu"
scope = "source.nu"
injection-regex = "nu"
file-types = ["nu", "nuon"]
shebangs = ["nu"]
comment-token = "#"
indent = { tab-width = 2, unit = "  " }
language-servers = [ "nu-lsp" ]

[[language]]
name ="html"
roots = ["angular.json"]
language-servers = ["angular","vscode-html-language-server"]


[[language]]
name = "zig"
scope = "source.zig"
injection-regex = "zig"
file-types = ["zig", "zon"]
roots = ["build.zig"]
auto-format = false
comment-tokens = ["//", "///", "//!"]
language-servers = [ "zls" ]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "zig" , args = ["fmt", "--stdin"] }



[[language]]
name = "rain"
scope = "source.rain"
file-types = ["rain"]
comment-tokens = ["//", "///"]
indent = { tab-width = 4, unit = "\t" }
grammar="c-sharp"

[[language]]
name = "jai"
scope = "source.jai"
file-types = ["jai"]
roots = ["build.jai", "first.jai", "main.jai"]
shebangs = ["jai", "jai-linux", "jai-macos"]
indent = { tab-width = 4, unit = " " }
grammar = "jai"
auto-format = false
comment-tokens = "//"
block-comment-tokens = { start = "/*", end = "*/" }

[language.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'

[[grammar]]
name = "jai"
source = { git = "https://github.com/constantitus/tree-sitter-jai", rev="889f8b310fa005c668853ba40a1c6cfc060b1a8b" }
